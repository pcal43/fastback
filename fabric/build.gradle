plugins {
	id 'java'
	id 'fabric-loom'
	id 'com.modrinth.minotaur'
	id 'net.darkhax.curseforgegradle'
}

base {
	archivesName = "${project.archives_base_name}-fabric-${project.mod_version}"
}

repositories {
	mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://repo.spongepowered.org/maven/' }
    maven { url = 'https://maven.nucleoid.xyz/' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation project(":common")

    modImplementation("me.lucko:fabric-permissions-api:${project.fabric_permissions_version}") { transitive = false }
    modImplementation("xyz.nucleoid:server-translations-api:${project.server_translations_version}")

	// jgit and dependencies - nested into the mod jar here (common is not a mod jar)
    modImplementation("org.eclipse.jgit:org.eclipse.jgit:${project.jgit_version}") { transitive = false }
    modImplementation("com.googlecode.javaewah:JavaEWAH:${project.JavaEWAH_version}") { transitive = false }
    modImplementation("org.eclipse.jgit:org.eclipse.jgit.ssh.apache:${project.jgit_version}") { transitive = false }
    modImplementation("org.apache.sshd:sshd-core:${project.apache_sshd_version}") { transitive = false }
	// sshd-common is included via the patched jar task below (strips FileSystemProvider service)
    modImplementation("net.i2p.crypto:eddsa:${project.eddsa_version}") { transitive = false }
}

processResources {
	// Substitute the mod version into fabric.mod.json
	inputs.property "mod_version", mod_version
	inputs.property "minecraft_version", minecraft_version
	inputs.property "java_version", java_version
	inputs.property "fabric_loader_version", fabric_loader_version
	filesMatching("fabric.mod.json") {
		expand "mod_version": mod_version,
				"minecraft_version": minecraft_version,
				"java_version": java_version,
				"fabric_loader_version": fabric_loader_version
	}
}

sourceSets {
	main {
		// Add common module sources to fabric's main sourceSet
		// This ensures they're compiled and remapped together
		java {
			srcDir project(":common").file("src/main/java")
		}
		resources {
			srcDir project(":common").file("src/main/resources")
		}
	}
	test {
		resources.srcDirs = ["src/test/resources"]
	}
}


loom {
	runs {
		client {
			client()
			setConfigName("Fabric Client")
			ideConfigGenerated(true)
			runDir("run")
		}
		server {
			server()
			setConfigName("Fabric Server")
			ideConfigGenerated(true)
			runDir("run")
		}
	}

	mixin {
		defaultRefmapName = "fastback-refmap.json"
	}

	mods {
		"fastback" {
			sourceSet sourceSets.main
		}
	}
}

jar {
	// copy LICENSE from the repo root and rename it to avoid conflicts with other mods
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name_fabric}"}
	}
	// Common sources are now part of main sourceSet, so they're automatically included
}

// Publishing configuration
modrinth {
	token = System.getenv("MODRINTH_TOKEN")
	projectId = project.modrinth_projectId
	versionNumber = project.mod_version
	versionName = "${project.mod_version} (fabric)"
	versionType = "release"
	uploadFile = remapJar
	changelog = "<p><a href='${project.github_projectUrl}/releases/tag/${project.mod_version}'>${project.github_projectUrl}/releases/tag/${project.mod_version}</a></p>"
	gameVersions = [ project.minecraft_version ]
	loaders = ["fabric"]
	dependencies {
		required.project "fabric-api"
	}
}

import net.darkhax.curseforgegradle.TaskPublishCurseForge

tasks.register('publishCurseForge', TaskPublishCurseForge) {
	// API Key from environment or fallback
	apiToken = System.getenv("CURSEFORGE_TOKEN") ?: 'CURSEFORGE_TOKEN NOT_SET'

	// Configure the main artifact
	// The plugin automatically detects Fabric & Java version from your Loom setup
	def mainFile = upload(project.curseforge_projectId, jar)

	mainFile.releaseType = "release"
	mainFile.changelog = "${project.github_projectUrl}/releases/tag/${project.mod_version}"
	mainFile.changelogType = "markdown"

	mainFile.addGameVersion(project.minecraft_version)
	mainFile.addModLoader("Fabric")

	// Ensure jar is finished before this runs
	dependsOn(remapJar)
}

// sshd-common registers RootedFileSystemProvider as a java.nio.file.spi.FileSystemProvider
// via META-INF/services. When Fabric's jar loader scans nested JARs, Java's ServiceLoader
// instantiates it immediately, triggering slf4j init against Minecraft's classloader and
// causing a ClassCastException. Strip that service entry from the jar before bundling.
def patchedSshdCommonDir = layout.buildDirectory.dir("patchedSshdCommon")

configurations {
    sshdCommonOriginal
}

dependencies {
    sshdCommonOriginal("org.apache.sshd:sshd-common:${project.apache_sshd_version}") { transitive = false }
}

tasks.register('patchSshdCommon', Zip) {
    dependsOn configurations.sshdCommonOriginal

    def originalJar = configurations.sshdCommonOriginal.resolvedConfiguration.resolvedArtifacts
        .find { it.name == 'sshd-common' }.file

    from(zipTree(originalJar)) {
        exclude 'META-INF/services/java.nio.file.spi.FileSystemProvider'
    }

    archiveFileName = "sshd-common-${project.apache_sshd_version}-patched.jar"
    destinationDirectory = patchedSshdCommonDir
}

// Use Loom's include() so the patched jar is properly registered in fabric.mod.json
// Ensure the patched jar is also placed on the dev run classpath so the runtime uses the stripped copy.
def patchedSshdCommonJar = files(patchedSshdCommonDir.map { it.file("sshd-common-${project.apache_sshd_version}-patched.jar") })

dependencies {
    modImplementation(patchedSshdCommonJar)
    include(patchedSshdCommonJar)
}

// Ensure the patched jar is created before compilation and include processing so Loom sees it
tasks.named('compileJava').configure {
    dependsOn tasks.named('patchSshdCommon')
}

tasks.named('processIncludeJars').configure {
    dependsOn tasks.named('patchSshdCommon')
}

// Ensure generateRemapClasspath runs after the patched jar is produced so Loom's validation passes
tasks.named('generateRemapClasspath').configure {
    dependsOn tasks.named('patchSshdCommon')
}
